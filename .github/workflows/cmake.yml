name: CMake

on:
  push:
    branches:
      - ci
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.8'

      - name: Configure
        run: cmake -S .

      - name: Build
        run: cmake --build
